plugins {
    id "net.fabricmc.fabric-loom" version "1.18-SNAPSHOT"
    id 'com.github.gmazzo.buildconfig' version '5.3.5'
}

def shortHash = providers.exec {
    commandLine "git", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.get().trim()

base {
    archivesName = project.archives_base_name
    version = project.mod_version + "-" + shortHash
    group = project.maven_group
}

buildConfig {
    buildConfigField(String, "HASH", shortHash)
    buildConfigField(String, "VERSION", project.mod_version)
    buildConfigField(String, "BUILD_NUMBER", project.build_number)
    buildConfigField(String, "BUILD_IDENTIFIER", project.build_identifier)
    buildConfigField(String, "BUILD_TIME", "${new Date(System.currentTimeMillis()).format("dd/MM/yyyy HH:mm")}")

    packageName "me.lyeddie.addon.util"
    useJavaOutput()
    generateAtSync = true
    documentation.set("Generated by BuildConfig plugin")
}

loom {
    accessWidenerPath = file("src/main/resources/shoreline-addon.accesswidener")
}

repositories {
    maven {
        name = "Meteor Dev Releases"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "Meteor Dev Snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "repo1.maven.org"
        url = "https://repo1.maven.org/maven2"
    }
}

dependencies {
    // Fabric
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Meteor
    implementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"
}

tasks {
    processResources {
        def propertyMap = [
            "version"   : project.version,
            "mc_version": project.minecraft_version,
            "hash": shortHash,
        ]

        filesMatching("fabric.mod.json") {
            expand(propertyMap)
        }
    }

    jar {
        from("LICENSE") {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release = 25
    }
}
